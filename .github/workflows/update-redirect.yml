name: Update redirect targets

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Regenerate redirect pages
        run: python update_redirect.py

      - name: Regenerate link-in-bio page
        run: python update_links_page.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Explicit allowlist (public repo — never stage anything else). A brand
          # with no upcoming event writes no page, so skip files that don't
          # exist instead of letting `git add` abort the whole run. --porcelain
          # (not `git diff`) so a page's first, untracked version gets committed.
          PAGES="wil.html wip.html index.html"
          if [ -n "$(git status --porcelain -- $PAGES)" ]; then
            for f in $PAGES manifest.json; do
              if [ -f "$f" ]; then git add -- "$f"; fi
            done
            git commit -m "Auto-update redirect targets and link page"
            git push
          else
            echo "No changes"
          fi
